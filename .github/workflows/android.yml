name: Build Flutter APK (Heartbeat Fixed)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'   # Dart 3.11.7 подходит под требование ^3.11.4
          channel: 'stable'

      - name: Create missing directories and placeholder file
        run: |
          mkdir -p assets/binaries
          mkdir -p android/app/libs
          touch android/app/libs/teapod-core.aar

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeapodStream-fixed
          path: build/app/outputs/flutter-apk/app-debug.apk
