name: Build TeapodStream (Full Source)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: teapod-stream

      - name: Clone teapod-tun2socks
        run: git clone https://github.com/Wendor/teapod-tun2socks.git teapod-tun2socks

      - name: Set up Go 1.21
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Set ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          gomobile init

      - name: Initialize Go modules (if missing)
        run: |
          cd teapod-tun2socks/go
          if [ ! -f go.mod ]; then
            go mod init teapod-tun2socks
          fi
          go mod tidy || true

          cd ${{ github.workspace }}/teapod-stream/teapod-core
          if [ ! -f go.mod ]; then
            go mod init teapod-core
          fi
          go mod tidy || true

      - name: Debug Go module status
        working-directory: teapod-stream/teapod-core
        run: |
          echo "=== Содержимое teapod-core ==="
          ls -la
          echo "=== Есть ли go.mod? ==="
          if [ -f go.mod ]; then
            cat go.mod
          else
            echo "go.mod отсутствует, создаём..."
            go mod init teapod-core
            cat go.mod
          fi
          echo "=== GO111MODULE ==="
          go env GO111MODULE
          echo "=== Попытка go mod tidy ==="
          go mod tidy || echo "go mod tidy завершился с ошибкой, но это может быть некритично"

      - name: Build teapod-core AAR
        working-directory: teapod-stream/teapod-core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          gomobile bind -target=android -o teapod-core.aar -androidapi 29 .

      - name: Copy AAR to Flutter project
        run: |
          mkdir -p teapod-stream/android/app/libs
          cp teapod-stream/teapod-core/teapod-core.aar teapod-stream/android/app/libs/

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'

      - name: Apply heartbeat fix
        working-directory: teapod-stream
        run: |
          find . -name "ProxyService.kt" -exec sed -i 's|GET /generate_204 HTTP/1.1\r\nHost: $destHost|GET http://cp.cloudflare.com/generate_204 HTTP/1.1\r\nHost: cp.cloudflare.com|g' {} +

      - name: Get Flutter dependencies
        working-directory: teapod-stream
        run: flutter pub get

      - name: Build APK (debug)
        working-directory: teapod-stream
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeapodStream-fixed
          path: teapod-stream/build/app/outputs/flutter-apk/app-debug.apk
