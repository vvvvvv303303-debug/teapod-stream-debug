name: Build TeapodStream (fixed heartbeat + core)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.21
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        run: |
          # Android SDK уже предустановлен, sdkmanager лежит здесь
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          # Принимаем лицензии
          yes | $SDKMANAGER --licenses

          # Устанавливаем NDK нужной версии
          $SDKMANAGER "ndk;28.2.13676358"

          # Убеждаемся, что путь существует
          ls -la $ANDROID_SDK_ROOT/ndk/28.2.13676358

          # Записываем ANDROID_NDK_HOME в окружение
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          gomobile init

      - name: Fix gomobile path in build.sh
        working-directory: teapod-core
        run: |
          sed -i "s|/Users/wendor/go/bin/gomobile|$(which gomobile)|g" build.sh

      - name: Build teapod-core AAR
        working-directory: teapod-core
        run: |
          chmod +x build.sh
          ./build.sh build
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Copy AAR to project
        run: |
          mkdir -p android/app/libs
          cp teapod-core/outputs/teapod-core-*.aar android/app/libs/

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'

      - name: Apply heartbeat fix
        run: |
          find . -name "ProxyService.kt" -exec sed -i 's|GET /generate_204 HTTP/1.1\r\nHost: $destHost|GET http://cp.cloudflare.com/generate_204 HTTP/1.1\r\nHost: cp.cloudflare.com|g' {} +

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeapodStream-fixed
          path: build/app/outputs/flutter-apk/app-debug.apk
