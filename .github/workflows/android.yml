name: Build TeapodStream (fixed heartbeat + core)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.21
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Set ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          gomobile init

      - name: Initialize Go module in teapod-core (if missing)
        working-directory: teapod-core
        run: |
          if [ ! -f go.mod ]; then
            go mod init teapod-core
          fi
          export GO111MODULE=on
          go mod tidy

      - name: Build teapod-core AAR directly with gomobile
        working-directory: teapod-core
        run: |
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358
          export GO111MODULE=on
          gomobile bind -target=android -o teapod-core.aar -androidapi 29 .

      - name: Copy AAR to project
        run: |
          mkdir -p android/app/libs
          cp teapod-core/teapod-core.aar android/app/libs/

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'

      - name: Apply heartbeat fix
        run: |
          find . -name "ProxyService.kt" -exec sed -i 's|GET /generate_204 HTTP/1.1\r\nHost: $destHost|GET http://cp.cloudflare.com/generate_204 HTTP/1.1\r\nHost: cp.cloudflare.com|g' {} +

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeapodStream-fixed
          path: build/app/outputs/flutter-apk/app-debug.apk
